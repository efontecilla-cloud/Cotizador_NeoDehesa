services:
  - type: web
    name: cotizador-via-trapenses
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: DATA_DIR
        value: /opt/render/project/src/data
      # Contraseñas de los usuarios: definirlas en el panel de Render (Environment), nunca en este archivo.
      - key: CLAVE_LEONOR
        sync: false
      - key: CLAVE_EXEQUIEL
        sync: false
      # Opcional: lista completa de usuarios y contraseñas (JSON, ver README)
      # - key: USERS
      #   value: '[{"usuario":"Leonor","clave":"...","rol":"vendedor","nombre":"Leonor Olavarria"},{"usuario":"Exequiel","clave":"...","rol":"admin","nombre":"Exequiel"}]'
      # Opcional: PIN adicional para marcar vendidos, guardar clientes y emitir cotizaciones
      # - key: ADMIN_PIN
      #   value: "1234"
    # Para que los datos sobrevivan a los redeploys, agrega un disco persistente (plan Starter o superior)
    # y apunta DATA_DIR a su ruta de montaje:
    # disk:
    #   name: datos
    #   mountPath: /var/data
    #   sizeGB: 1
