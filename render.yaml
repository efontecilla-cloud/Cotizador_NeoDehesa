services:
  - type: web
    name: cotizador-via-trapenses
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: DATA_DIR
        value: /var/data
      # Contraseñas de los usuarios: definirlas en el panel de Render (Environment), nunca en este archivo.
      - key: CLAVE_LEONOR
        sync: false
      - key: CLAVE_EXEQUIEL
        sync: false
      # Opcional: lista completa de usuarios y contraseñas (JSON, ver README)
      # - key: USERS
      #   value: '[{"usuario":"Leonor","clave":"...","rol":"vendedor","nombre":"Leonor Olavarria"},{"usuario":"Exequiel","clave":"...","rol":"admin","nombre":"Exequiel"}]'
      # Opcional: PIN adicional para marcar vendidos, guardar clientes y emitir cotizaciones
      # - key: ADMIN_PIN
      #   value: "1234"
    # Disco persistente: los datos (db.json) sobreviven a deploys y reinicios. Debe coincidir con DATA_DIR.
    disk:
      name: datos
      mountPath: /var/data
      sizeGB: 1
